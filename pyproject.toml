[project]
name = "multi-turn-chatbot-eval"
version = "0.1.0"
description = "Multi-turn chatbot evaluation framework for JO's Bike Shop"
requires-python = ">=3.10"
dependencies = [
    "burr[streamlit,start]==0.40.2",
    "deepeval==3.7.8",
    "openai>=2.0.0",
    "opentelemetry-instrumentation-openai==0.47.5",
    "python-dotenv==1.1.1",
    "instructor>=1.13.0",
]

[tool.uv]
dev-dependencies = [
    "black",
    "flake8",
    "mypy",
    "pytest",
    "pytest-asyncio",
]
